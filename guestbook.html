<!DOCTYPE html>
<html lang="ru">

</head>
<body>
  <header>
    <h1>Гостевая книга</h1>
    <nav>
      <a href="index.html">Главная</a>
      <a href="blog.html">Блог</a>
      <a href="guestbook.html">Гостевая книга</a>
    </nav>
  </header>

  <main>
    <p>Оставь имя и сообщение — оно придёт мне на почту, и я отвечу.</p>
    <form action="https://formspree.io/f/mwlkqydb" method="POST">
      <label>Имя / никнейм:
        <input type="text" name="name" required>
      </label>
      <label>Твой e-mail (куда отвечать):
        <input type="email" name="email" required>
      </label>
      <label>Сообщение:
        <textarea name="message" rows="5" required></textarea>
      </label>
      <button type="submit">Отправить</button>
    </form>
  </main>

  <footer><p><a href="index.html">← на главную</a></p></footer>
